# 主页 SPA（main）+ 走西口独立静态站（zou_xi_kou 分支 → /zou-xikou/）
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, zou_xi_kou]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 解析 Pages 前缀
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "SITE_ROOT=/" >> "$GITHUB_ENV"
          else
            echo "SITE_ROOT=/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: 构建主页 SPA（main）
        run: |
          git checkout main
          npm ci
          npm run build
        env:
          VITE_BASE: ${{ env.SITE_ROOT }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: 收集 SPA 产物到 deploy/
        run: |
          mkdir -p deploy
          cp -r dist/* deploy/
          cp public/.nojekyll deploy/.nojekyll 2>/dev/null || echo > deploy/.nojekyll

      - name: 构建「走西口」→ /zou-xikou/
        run: |
          git checkout zou_xi_kou
          npm ci
          npm run build
        env:
          VITE_BASE: ${{ env.SITE_ROOT }}zou-xikou/
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: 收集 zou-xikou 产物
        run: |
          mkdir -p deploy/zou-xikou
          cp -r dist/* deploy/zou-xikou/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
