# 双主题 GitHub Pages：根目录入口 + /nanyang/ + /chuang-guandong/
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, Chuang-Guandong, nanyang]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 解析仓库 Pages 前缀
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "SITE_ROOT=/" >> "$GITHUB_ENV"
          else
            echo "SITE_ROOT=/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: 构建「潮汕下南洋」→ /nanyang/
        run: |
          git checkout nanyang
          npm ci
          npm run build
        env:
          VITE_BASE: ${{ env.SITE_ROOT }}nanyang/
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: 收集 nanyang 产物
        run: |
          mkdir -p deploy/nanyang
          cp -r dist/* deploy/nanyang/

      - name: 构建「闯关东」→ /chuang-guandong/
        run: |
          git checkout Chuang-Guandong
          npm ci
          npm run build
        env:
          VITE_BASE: ${{ env.SITE_ROOT }}chuang-guandong/
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: 收集 chuang-guandong 产物
        run: |
          mkdir -p deploy/chuang-guandong
          cp -r dist/* deploy/chuang-guandong/

      - name: 根目录入口页
        run: cp public/portal/index.html deploy/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
